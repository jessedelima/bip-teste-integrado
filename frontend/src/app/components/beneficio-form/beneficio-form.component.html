<div class="beneficio-form">
  <div class="header">
    <h1>{{ isEditMode ? 'Editar Benefício' : 'Novo Benefício' }}</h1>
  </div>

  <div *ngIf="error" class="alert alert-error">
    {{ error }}
  </div>

  <div *ngIf="success" class="alert alert-success">
    {{ success }}
  </div>

  <div *ngIf="loading" class="loading">
    <div class="spinner"></div>
    <p>{{ isEditMode ? 'Carregando benefício...' : 'Salvando benefício...' }}</p>
  </div>

  <div class="card" *ngIf="!loading">
    <form [formGroup]="beneficioForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="nome">Nome *</label>
        <input
          type="text"
          id="nome"
          formControlName="nome"
          [class.error]="getFieldError('nome')"
          placeholder="Digite o nome do benefício"
        >
        <div class="error-message" *ngIf="getFieldError('nome')">
          {{ getFieldError('nome') }}
        </div>
      </div>

      <div class="form-group">
        <label for="descricao">Descrição *</label>
        <textarea
          id="descricao"
          formControlName="descricao"
          rows="4"
          [class.error]="getFieldError('descricao')"
          placeholder="Digite a descrição do benefício"
        ></textarea>
        <div class="error-message" *ngIf="getFieldError('descricao')">
          {{ getFieldError('descricao') }}
        </div>
      </div>

      <div class="form-group">
        <label for="valor">Valor *</label>
        <input
          type="number"
          id="valor"
          formControlName="valor"
          step="0.01"
          min="0"
          [class.error]="getFieldError('valor')"
          placeholder="0.00"
        >
        <div class="error-message" *ngIf="getFieldError('valor')">
          {{ getFieldError('valor') }}
        </div>
      </div>

      <div class="form-group">
        <label class="checkbox-label">
          <input
            type="checkbox"
            formControlName="ativo"
          >
          <span class="checkmark"></span>
          Benefício ativo
        </label>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="onCancel()">
          Cancelar
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="beneficioForm.invalid || loading">
          {{ isEditMode ? 'Atualizar' : 'Criar' }}
        </button>
      </div>
    </form>
  </div>
</div>
