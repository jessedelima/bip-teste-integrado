<div class="transfer-form card">
  <h1>Transferência de Benefícios</h1>

  <div *ngIf="error" class="alert alert-error">{{ error }}</div>
  <div *ngIf="success" class="alert alert-success">{{ success }}</div>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-group">
      <label for="fromId">ID de origem *</label>
      <input id="fromId" type="number" formControlName="fromId" min="1" placeholder="ID do benefício de origem">
      <div class="error-message" *ngIf="getError('fromId')">{{ getError('fromId') }}</div>
    </div>

    <div class="form-group">
      <label for="toId">ID de destino *</label>
      <input id="toId" type="number" formControlName="toId" min="1" placeholder="ID do benefício de destino">
      <div class="error-message" *ngIf="getError('toId')">{{ getError('toId') }}</div>
    </div>

    <div class="form-group">
      <label for="amount">Valor *</label>
      <input id="amount" type="number" formControlName="amount" step="0.01" min="0" placeholder="0.00">
      <div class="error-message" *ngIf="getError('amount')">{{ getError('amount') }}</div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-success" [disabled]="form.invalid || loading">Transferir</button>
    </div>
  </form>
</div>
