<div class="beneficio-list">
  <div class="header">
    <h1>Lista de Benefícios</h1>
    <button class="btn btn-primary" (click)="createNew()">
      Novo Benefício
    </button>
  </div>

  <div *ngIf="error" class="alert alert-error">
    {{ error }}
  </div>

  <div *ngIf="loading" class="loading">
    <div class="spinner"></div>
    <p>Carregando benefícios...</p>
  </div>

  <div *ngIf="!loading && beneficios.length === 0 && !error" class="empty-state">
    <p>Nenhum benefício encontrado.</p>
    <button class="btn btn-primary" (click)="createNew()">
      Criar Primeiro Benefício
    </button>
  </div>

  <div *ngIf="!loading && beneficios.length > 0" class="table-container">
    <table class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Descrição</th>
          <th>Valor</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let beneficio of beneficios">
          <td>{{ beneficio.id }}</td>
          <td>{{ beneficio.nome }}</td>
          <td>{{ beneficio.descricao }}</td>
          <td>{{ beneficio.valor | currency:'BRL':'symbol':'1.2-2' }}</td>
          <td>
            <span class="status" [class.active]="beneficio.ativo" [class.inactive]="!beneficio.ativo">
              {{ beneficio.ativo ? 'Ativo' : 'Inativo' }}
            </span>
          </td>
          <td class="actions">
            <button class="btn btn-sm btn-primary" (click)="viewBeneficio(beneficio.id!)" title="Visualizar">
              👁️
            </button>
            <button class="btn btn-sm btn-secondary" (click)="editBeneficio(beneficio.id!)" title="Editar">
              ✏️
            </button>
            <button class="btn btn-sm btn-danger" (click)="deleteBeneficio(beneficio.id!, beneficio.nome)" title="Excluir">
              🗑️
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
